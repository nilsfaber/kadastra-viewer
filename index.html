<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadastra Viewer</title>
  <link rel="manifest" href="manifest.json">
  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0f1117; --surface:#1a1d27; --border:#2a2d3a; --text:#d4d8e8; --muted:#6b7094; --accent:#5b8aff; }
    body { background:var(--bg); color:var(--text); font:13px/1.5 system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    header { background:var(--surface); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; align-items:center; gap:16px; flex-shrink:0; }
    header h1 { font-size:.9rem; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    select,button { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:4px 10px; border-radius:5px; font-size:12px; cursor:pointer; }
    select:focus,button:hover { border-color:var(--accent); outline:none; }
    .toggle-group { display:flex; gap:4px; }
    .toggle-btn { padding:4px 10px; border-radius:5px; font-size:11px; font-weight:600; }
    .toggle-btn.on { background:rgba(91,138,255,.2); border-color:var(--accent); color:var(--accent); }
    #cv-wrap { flex:1; position:relative; }
    canvas { display:block; width:100%; height:100%; }
    #cv2d { position:absolute; inset:0; cursor:grab; }
    #cv2d.dragging { cursor:grabbing; }
    #graph-search { background:var(--bg); border:1px solid var(--border); border-radius:5px; color:var(--text); padding:4px 10px; font-size:12px; width:200px; }
    #graph-search:focus { outline:none; border-color:var(--accent); }
    .view-btn:disabled { opacity:.4; cursor:not-allowed; }
    #tip { position:fixed; pointer-events:none; background:rgba(26,29,39,.92); border:1px solid var(--border); border-radius:5px; padding:4px 8px; font-size:12px; color:var(--text); display:none; white-space:nowrap; z-index:20; }
    #info { position:absolute; top:0; right:0; width:280px; height:100%; background:var(--surface); border-left:1px solid var(--border); padding:14px; overflow-y:auto; font-size:12px; display:none; z-index:10; }
    #info h2 { font-size:14px; margin-bottom:8px; }
    #info .kv { display:flex; gap:6px; margin-bottom:4px; }
    #info .k { color:var(--muted); min-width:80px; }
    #info .v { color:var(--text); }
    #info p { color:var(--muted); margin-top:10px; line-height:1.6; font-size:11px; }

    /* ── View toggle ── */
    .view-btn { padding:4px 12px; border-radius:5px; font-size:12px; font-weight:600; cursor:pointer; background:var(--bg); border:1px solid var(--border); color:var(--muted); transition:border-color .15s,color .15s,background .15s; }
    .view-btn.on { background:rgba(91,138,255,.15); border-color:var(--accent); color:var(--accent); }

    /* ── Sub-controls rows (graph + catalog) ── */
    #graph-controls, #cat-controls { background:var(--surface); border-bottom:1px solid var(--border); padding:6px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex-shrink:0; }
    #graph-controls[hidden], #cat-controls[hidden] { display:none; }
    .cat-stage-nav { display:flex; gap:4px; flex-wrap:wrap; }
    .cat-stage-btn { display:flex; flex-direction:column; align-items:center; padding:4px 10px; border:1px solid var(--border); background:var(--bg); color:var(--muted); border-radius:6px; cursor:pointer; font-size:11px; line-height:1.3; transition:border-color .15s,color .15s,background .15s; }
    .cat-stage-btn .stage-code { font-weight:600; font-size:12px; }
    .cat-stage-btn .stage-label { font-size:10px; }
    .cat-stage-btn:hover { border-color:var(--accent); color:var(--text); }
    .cat-stage-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(91,138,255,.1); }
    #cat-search { background:var(--bg); border:1px solid var(--border); border-radius:5px; color:var(--text); padding:4px 10px; font-size:12px; width:180px; }
    #cat-search:focus { outline:none; border-color:var(--accent); }

    /* ── Catalog workspace ── */
    #catalog-view { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    #catalog-view[hidden] { display:none; }
    .cat-workspace { flex:1; display:flex; overflow:hidden; }
    .cat-pane-list { flex:1; overflow-y:auto; }
    #cat-table { width:100%; border-collapse:collapse; font-size:13px; }
    #cat-table th { text-align:left; padding:6px 10px; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); cursor:pointer; user-select:none; }
    #cat-table th:hover { color:var(--text); }
    #cat-table td { padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
    #cat-table tbody tr { cursor:pointer; }
    #cat-table tbody tr:hover { background:var(--surface); }
    #cat-table tbody tr.active { background:rgba(91,138,255,.12); }
    .cat-sort-arrow { color:var(--accent); font-size:10px; margin-left:3px; display:inline-block; width:1em; }
    .cat-pane-detail { width:380px; flex-shrink:0; border-left:1px solid var(--border); background:var(--surface); overflow-y:auto; display:flex; flex-direction:column; }
    .cat-pane-detail[hidden] { display:none; }
    .cat-detail-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; border-bottom:1px solid var(--border); }
    .cat-detail-header h2 { font-size:14px; font-weight:600; color:var(--text); }
    .btn-close-cat { background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px; }
    .btn-close-cat:hover { color:var(--text); }
    .cat-fields { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
    .cat-field { display:flex; flex-direction:column; gap:2px; }
    .cat-field .kl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    .cat-field .vl { font-size:13px; color:var(--text); }
    .cat-field-row { display:flex; gap:14px; }
    .cat-desc { font-size:12px; color:var(--muted); line-height:1.6; margin-top:2px; }
    .cat-edges-section { padding:14px 16px; border-top:1px solid var(--border); flex:1; }
    .cat-edges-section h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; }
    .cat-edge-dir { font-size:11px; color:var(--muted); margin:6px 0 3px; }
    .cat-edges-section ul { list-style:none; display:flex; flex-direction:column; gap:4px; }
    .cat-edges-section li { display:flex; align-items:center; gap:6px; font-size:12px; padding:4px 8px; background:var(--bg); border-radius:4px; border:1px solid var(--border); }
    .cat-edge-type { font-size:10px; color:var(--muted); flex-shrink:0; }
    .cat-edge-link { color:var(--accent); cursor:pointer; text-decoration:none; flex:1; }
    .cat-edge-link:hover { text-decoration:underline; }
    .badge { display:inline-block; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
    .badge-sci        { background:rgba(78,205,196,.15);  color:#4ecdc4; }
    .badge-spec       { background:rgba(199,125,255,.15); color:#c77dff; }
    .badge-confirmed  { background:rgba(67,214,140,.15);  color:#43d68c; }
    .badge-unreviewed { background:rgba(245,166,35,.15);  color:#f5a623; }
    .badge-noise      { background:rgba(255,107,107,.15); color:#ff6b6b; }
    .cat-flag       { font-size:11px; color:var(--muted); }
    .cat-flag-active{ color:#f5a623; }
    .cat-empty { color:var(--muted); font-style:italic; }
  </style>
</head>
<body>
<header>
  <h1>Kadastra</h1>
  <div class="controls">
    <div style="margin-left:auto;display:flex;gap:4px">
      <button id="btn-view-catalog" class="view-btn on">Catalog</button>
      <button id="btn-view-2d" class="view-btn">2D</button>
      <button id="btn-view-3d" class="view-btn">3D</button>
    </div>
  </div>
</header>

<div id="graph-controls" hidden>
  <select id="sel-stage">
    <option value="" selected>All stages</option>
    <option value="K0_EARTH">K0_EARTH — Terrestrial</option>
    <option value="K0_ORBIT">K0_ORBIT — Orbital</option>
    <option value="K0_LUNAR">K0_LUNAR — Lunar</option>
    <option value="K0_INNER">K0_INNER — Inner System</option>
    <option value="K0_OUTER">K0_OUTER — Outer System</option>
    <option value="K0_REACH">K0_REACH — Interstellar Reach</option>
    <option value="K1">K1 — Type I</option>
    <option value="K2">K2 — Type II</option>
  </select>
  <div class="toggle-group">
    <button class="toggle-btn on" data-layer="scientific">Scientific</button>
    <button class="toggle-btn on" data-layer="speculative">Speculative</button>
  </div>
  <div class="toggle-group" title="Edge types">
    <button class="toggle-btn on" data-edgetype="enables">enables</button>
    <button class="toggle-btn on" data-edgetype="alternative_to">alternative</button>
    <button class="toggle-btn on" data-edgetype="related">related</button>
  </div>
  <button id="btn-fit">Fit</button>
  <select id="sel-lineage" title="How far to follow prerequisites / dependents of the selected concept">
    <option value="1">Lineage: 1 step</option>
    <option value="2" selected>Lineage: 2 steps</option>
    <option value="3">Lineage: 3 steps</option>
    <option value="Infinity">Lineage: full</option>
  </select>
  <input id="graph-search" list="graph-names" placeholder="Find concept…" autocomplete="off">
  <datalist id="graph-names"></datalist>
  <span id="status">Loading…</span>
</div>

<div id="cat-controls">
  <nav class="cat-stage-nav" id="cat-stage-nav">
    <button class="cat-stage-btn active" data-stage="K0_EARTH"><span class="stage-code">K0_EARTH</span><span class="stage-label">Terrestrial</span></button>
    <button class="cat-stage-btn" data-stage="K0_ORBIT"><span class="stage-code">K0_ORBIT</span><span class="stage-label">Orbital</span></button>
    <button class="cat-stage-btn" data-stage="K0_LUNAR"><span class="stage-code">K0_LUNAR</span><span class="stage-label">Lunar</span></button>
    <button class="cat-stage-btn" data-stage="K0_INNER"><span class="stage-code">K0_INNER</span><span class="stage-label">Inner System</span></button>
    <button class="cat-stage-btn" data-stage="K0_OUTER"><span class="stage-code">K0_OUTER</span><span class="stage-label">Outer System</span></button>
    <button class="cat-stage-btn" data-stage="K0_REACH"><span class="stage-code">K0_REACH</span><span class="stage-label">Interstellar Reach</span></button>
    <button class="cat-stage-btn" data-stage="K1"><span class="stage-code">K1</span><span class="stage-label">Type I</span></button>
    <button class="cat-stage-btn" data-stage="K2"><span class="stage-code">K2</span><span class="stage-label">Type II</span></button>
  </nav>
  <input type="text" id="cat-search" placeholder="Search concepts…" autocomplete="off">
</div>

<div id="cv-wrap" hidden>
  <canvas id="cv"></canvas>
  <canvas id="cv2d"></canvas>
  <div id="tip"></div>
  <div id="info">
    <h2 id="info-name"></h2>
    <div class="kv"><span class="k">Stage</span><span class="v" id="info-stage"></span></div>
    <div class="kv"><span class="k">Domain</span><span class="v" id="info-domain"></span></div>
    <div class="kv"><span class="k">Layer</span><span class="v" id="info-layer"></span></div>
    <div class="kv"><span class="k">Maturity</span><span class="v" id="info-maturity"></span></div>
    <div class="kv"><span class="k">Confidence</span><span class="v" id="info-confidence"></span></div>
    <div class="kv"><span class="k">Connections</span><span class="v" id="info-connections"></span></div>
    <div class="kv"><span class="k">Importance</span><span class="v" id="info-importance"></span></div>
    <div class="kv"><span class="k">Lineage</span><span class="v" id="info-lineage"></span></div>
    <p id="info-desc"></p>
  </div>
</div>

<div id="catalog-view">
  <div class="cat-workspace">
    <section class="cat-pane-list">
      <table id="cat-table">
        <thead>
          <tr>
            <th data-sort="name">Name<span class="cat-sort-arrow"></span></th>
            <th data-sort="domain">Domain<span class="cat-sort-arrow"></span></th>
            <th data-sort="layer">Layer<span class="cat-sort-arrow"></span></th>
            <th data-sort="maturity">Maturity<span class="cat-sort-arrow"></span></th>
            <th data-sort="confidence">Confidence<span class="cat-sort-arrow"></span></th>
            <th data-sort="flags">Flags<span class="cat-sort-arrow"></span></th>
            <th data-sort="links">Links<span class="cat-sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="cat-tbody">
          <tr><td colspan="7" class="cat-empty">Select a stage above.</td></tr>
        </tbody>
      </table>
    </section>
    <aside class="cat-pane-detail" id="cat-pane-detail" hidden>
      <div class="cat-detail-header">
        <h2 id="cat-detail-title">—</h2>
        <button class="btn-close-cat" id="btn-close-cat">✕</button>
      </div>
      <div class="cat-fields">
        <div class="cat-field-row">
          <div class="cat-field"><span class="kl">Domain</span><span class="vl" id="cd-domain"></span></div>
          <div class="cat-field"><span class="kl">Stage</span><span class="vl" id="cd-stage"></span></div>
        </div>
        <div class="cat-field-row">
          <div class="cat-field"><span class="kl">Layer</span><span class="vl" id="cd-layer"></span></div>
          <div class="cat-field"><span class="kl">Maturity</span><span class="vl" id="cd-maturity"></span></div>
        </div>
        <div class="cat-field-row">
          <div class="cat-field"><span class="kl">Confidence</span><span class="vl" id="cd-confidence"></span></div>
          <div class="cat-field"><span class="kl">Flags</span><span class="vl" id="cd-flags"></span></div>
        </div>
        <div class="cat-field">
          <span class="kl">Description</span>
          <p class="cat-desc" id="cd-description"></p>
        </div>
      </div>
      <div class="cat-edges-section">
        <h3>Edges</h3>
        <p class="cat-edge-dir">Enables / related to →</p>
        <ul id="cat-edges-out"></ul>
        <p class="cat-edge-dir">← Enabled by / related from</p>
        <ul id="cat-edges-in"></ul>
      </div>
    </aside>
  </div>
</div>

<script>
"use strict";
const DOMAIN_COLORS = {
  propulsion:"#ff6b6b",energy:"#ffa94d",habitation:"#a9e34b",governance:"#4ecdc4",
  biology:"#74c0fc",communication:"#c77dff",economics:"#f5a623",manufacturing:"#63e6be",
  science:"#5b8aff",philosophy:"#da77f2",ai:"#ff8787",military:"#868e96",
};

let allNodes=[], allEdges=[], currentNodes=[], layerVisible={scientific:true,speculative:true}, degreeMap={};
let edgeTypeVisible={enables:true,alternative_to:true,related:true};
let selectedId=null, visEdges=[], selLineage=null, lineageDepth=2;
let baseNCol=null, baseNSiz=null;
let pColAttr=null, pSizAttr=null, lColAttr=null;
const SEGS=10;
const EDGE_BASE={enables:0x34406a, alternative_to:0x6e4e2e, related:0x2e323f};
const UP_COLOR=0xffb86b, DOWN_COLOR=0x7baeff;

// ── Three.js ──────────────────────────────────────────────────────────────────
const wrap     = document.getElementById("cv-wrap");
const canvas   = document.getElementById("cv");
const renderer = (() => {
  try {
    const r = new THREE.WebGLRenderer({canvas, antialias:true});
    r.setPixelRatio(Math.min(devicePixelRatio,2));
    return r;
  } catch (err) {
    console.warn("WebGL unavailable — 3D view disabled", err);
    return null;
  }
})();
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0f1117);
scene.fog = new THREE.FogExp2(0x0f1117, 0.00002);
const camera = new THREE.PerspectiveCamera(60,1,1,200000);

let pointsMesh=null, linesMesh=null;

// ── OrbitControls ─────────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.enableZoom = false; // we handle zoom ourselves for zoom-to-cursor
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
camera.position.set(0, 4000, 8000);

let didDrag=false;
canvas.addEventListener("mousedown", ()=>{ didDrag=false; });
controls.addEventListener("change", ()=>{ didDrag=true; });
canvas.addEventListener("mousemove", doHover);

// ── Raycasting ────────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 25;
const tip = document.getElementById("tip");

function ndcFromEvent(e){
  const r=canvas.getBoundingClientRect();
  return new THREE.Vector2((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height)*2+1);
}

// Zoom to cursor — OrbitControls zoom disabled, we own the wheel entirely
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  const speed = (e.ctrlKey||e.metaKey) ? 0.008 : 0.001;
  const dist = camera.position.distanceTo(controls.target);
  const newDist = Math.max(100, Math.min(60000, dist*(1+e.deltaY*speed)));
  raycaster.setFromCamera(ndcFromEvent(e), camera);
  const D = raycaster.ray.direction;
  const camDir = new THREE.Vector3().subVectors(controls.target, camera.position).normalize();
  const denom = D.dot(camDir);
  if(Math.abs(denom) > 1e-4){
    const W = new THREE.Vector3().copy(camera.position).addScaledVector(D, dist/denom);
    controls.target.lerpVectors(W, controls.target, newDist/dist);
  }
  // Move camera to maintain newDist from updated target
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, newDist);
  controls.update();
},{passive:false});
function doHover(e){
  if(!pointsMesh||!currentNodes.length) return;
  raycaster.setFromCamera(ndcFromEvent(e),camera);
  const hits=raycaster.intersectObject(pointsMesh);
  if(hits.length){
    const n=currentNodes[hits[0].index];
    tip.textContent=n.name; tip.style.display="block";
    tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-6)+"px";
    canvas.style.cursor="pointer";
  } else {
    tip.style.display="none"; canvas.style.cursor="";
  }
}
canvas.addEventListener("click", e=>{
  if(didDrag) return;
  if(!pointsMesh||!currentNodes.length) return;
  raycaster.setFromCamera(ndcFromEvent(e),camera);
  const hits=raycaster.intersectObject(pointsMesh);
  selectNode(hits.length ? currentNodes[hits[0].index] : null);
});

function selectNode(n){
  const info=document.getElementById("info");
  selectedId = n ? n.id : null;
  applySelection();
  if(!n){ info.style.display="none"; return; }
  document.getElementById("info-name").textContent      =n.name;
  document.getElementById("info-stage").textContent     =n.stage;
  document.getElementById("info-domain").textContent    =n.domain;
  document.getElementById("info-layer").textContent     =n.layer;
  document.getElementById("info-maturity").textContent  =n.maturity;
  document.getElementById("info-confidence").textContent=n.confidence;
  document.getElementById("info-connections").textContent=degreeMap[n.id]??0;
  document.getElementById("info-importance").textContent = n.weight==null ? "—" :
    `${Math.round(n.weight*100)}% · ${n.source_count} source(s) · unlocks ${n.reach}${n.is_enabler?" · enabler":""}${n.importance==="major"?" · major":""}`;
  const full=lineage(n.id), direct=d=>Object.values(d).filter(v=>v===1).length;
  document.getElementById("info-lineage").textContent=
    `${direct(full.up)} direct prerequisites (${Object.keys(full.up).length-1} total) · `+
    `${direct(full.down)} direct dependents (${Object.keys(full.down).length-1} total)`;
  document.getElementById("info-desc").textContent      =n.description??"";
  info.style.display="block";
}

// ── Build geometry ────────────────────────────────────────────────────────────
function buildGraph(){
  const sf=document.getElementById("sel-stage").value;
  currentNodes=allNodes.filter(c=>(!sf||c.stage===sf)&&layerVisible[c.layer]);
  const ids=new Set(currentNodes.map(c=>c.id));

  // Nodes
  const nPos=new Float32Array(currentNodes.length*3);
  const nCol=new Float32Array(currentNodes.length*3);
  const nSiz=new Float32Array(currentNodes.length);
  const maxDeg=Math.max(1,...Object.values(degreeMap));
  const tmp=new THREE.Color();
  currentNodes.forEach((n,i)=>{
    nPos[i*3]=n.pos_x??0; nPos[i*3+1]=n.pos_y??0; nPos[i*3+2]=n.pos_z??0;
    tmp.set(DOMAIN_COLORS[n.domain]??"#888");
    if(n.layer==="speculative") tmp.lerp(new THREE.Color(0xc77dff),0.35);
    nCol[i*3]=tmp.r; nCol[i*3+1]=tmp.g; nCol[i*3+2]=tmp.b;
    nSiz[i]=(5+20*nodeWeight(n))*40;
  });
  baseNCol=nCol.slice(); baseNSiz=nSiz.slice();
  const pGeo=new THREE.BufferGeometry();
  pColAttr=new THREE.BufferAttribute(nCol,3); pColAttr.setUsage(THREE.DynamicDrawUsage);
  pSizAttr=new THREE.BufferAttribute(nSiz,1); pSizAttr.setUsage(THREE.DynamicDrawUsage);
  pGeo.setAttribute("position",new THREE.BufferAttribute(nPos,3));
  pGeo.setAttribute("color",pColAttr);
  pGeo.setAttribute("aSize",pSizAttr);
  const pMat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      attribute float aSize;
      attribute vec3 color;
      varying vec3 vColor;
      void main(){
        vColor=color;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=aSize*(300.0/-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vColor;
      void main(){
        float r=length(gl_PointCoord-0.5)*2.0;
        if(r>1.0) discard;
        float a=pow(1.0-r,2.2);         // soft-disk falloff
        float core=pow(1.0-r,8.0)*0.6;  // bright inner core
        gl_FragColor=vec4(vColor*(a+core), a);
      }`,
  });
  if(pointsMesh) scene.remove(pointsMesh);
  pointsMesh=new THREE.Points(pGeo,pMat);
  scene.add(pointsMesh);

  // Edges — quadratic bezier arcs with per-vertex color for selection highlight
  const nMap={}; currentNodes.forEach(n=>{nMap[n.id]=n;});
  visEdges=allEdges.filter(e=>ids.has(e.source_id)&&ids.has(e.target_id)&&edgeTypeVisible[e.type]!==false);
  const vertsPerEdge=SEGS*2;
  const eBuf=new Float32Array(visEdges.length*vertsPerEdge*3);
  const eColBuf=new Float32Array(visEdges.length*vertsPerEdge*3);
  const dimC=new THREE.Color(0x3a3f5c);
  let ei=0, ci=0;
  visEdges.forEach(e=>{
    const s=nMap[e.source_id], t=nMap[e.target_id];
    const ax=s.pos_x??0, ay=s.pos_y??0, az=s.pos_z??0;
    const bx=t.pos_x??0, by=t.pos_y??0, bz=t.pos_z??0;
    const cx=(ax+bx)/2, cy=(ay+by)/2;
    const dist=Math.sqrt((bx-ax)**2+(by-ay)**2+(bz-az)**2);
    // bulge out of the stage/lane plane so arcs don't cut across other tracks in front view
    const cz=(az+bz)/2+dist*0.15;
    const base=new THREE.Color(EDGE_BASE[e.type]??0x3a3f5c);
    for(let k=0;k<SEGS;k++){
      const t0=k/SEGS, t1=(k+1)/SEGS, u0=1-t0, u1=1-t1;
      eBuf[ei++]=u0*u0*ax+2*u0*t0*cx+t0*t0*bx;
      eBuf[ei++]=u0*u0*ay+2*u0*t0*cy+t0*t0*by;
      eBuf[ei++]=u0*u0*az+2*u0*t0*cz+t0*t0*bz;
      eBuf[ei++]=u1*u1*ax+2*u1*t1*cx+t1*t1*bx;
      eBuf[ei++]=u1*u1*ay+2*u1*t1*cy+t1*t1*by;
      eBuf[ei++]=u1*u1*az+2*u1*t1*cz+t1*t1*bz;
      for(let v=0;v<2;v++){ eColBuf[ci++]=base.r; eColBuf[ci++]=base.g; eColBuf[ci++]=base.b; }
    }
  });
  const lGeo=new THREE.BufferGeometry();
  lGeo.setAttribute("position",new THREE.BufferAttribute(eBuf,3));
  lColAttr=new THREE.BufferAttribute(eColBuf,3); lColAttr.setUsage(THREE.DynamicDrawUsage);
  lGeo.setAttribute("color",lColAttr);
  const lMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.5});
  if(linesMesh) scene.remove(linesMesh);
  linesMesh=new THREE.LineSegments(lGeo,lMat);
  scene.add(linesMesh);

  document.getElementById("status").textContent=`${currentNodes.length} concepts · ${visEdges.length} edges`;
  tip.style.display="none";
  applySelection();
}

function lineage(id, maxDepth=Infinity){
  // upstream = transitive prerequisites, downstream = everything this enables; other edge types 1 hop
  const fwd={}, back={}, side={};
  allEdges.forEach(e=>{
    if(edgeTypeVisible[e.type]===false) return;
    if(e.type==='enables'){
      (fwd[e.source_id]||(fwd[e.source_id]=[])).push(e.target_id);
      (back[e.target_id]||(back[e.target_id]=[])).push(e.source_id);
    } else if(e.source_id===id) side[e.target_id]=true;
    else if(e.target_id===id) side[e.source_id]=true;
  });
  const walk=(adj)=>{
    const d={[id]:0}, q=[id];
    for(let i=0;i<q.length;i++){
      if(d[q[i]]>=maxDepth) continue;
      for(const n of adj[q[i]]||[]) if(d[n]===undefined){ d[n]=d[q[i]]+1; q.push(n); }
    }
    return d;
  };
  return {up:walk(back), down:walk(fwd), side};
}

function applySelection(){
  selLineage = selectedId===null ? null : lineage(selectedId, lineageDepth);
  draw2d();
  if(!pColAttr||!pSizAttr||!lColAttr) return;
  const nC=pColAttr.array, nS=pSizAttr.array, eC=lColAttr.array;
  const vertsPerEdge=SEGS*2;
  const setEdge=(j,col)=>{
    for(let v=0;v<vertsPerEdge;v++){ const k=(j*vertsPerEdge+v)*3; eC[k]=col.r; eC[k+1]=col.g; eC[k+2]=col.b; }
  };
  if(selectedId===null){
    nC.set(baseNCol); nS.set(baseNSiz);
    visEdges.forEach((e,j)=>setEdge(j,new THREE.Color(EDGE_BASE[e.type]??0x3a3f5c)));
  } else {
    const {up,down,side}=selLineage;
    const upC=new THREE.Color(UP_COLOR), downC=new THREE.Color(DOWN_COLOR), tmp=new THREE.Color();
    const DIM=0.07;
    currentNodes.forEach((n,i)=>{
      let col=null, size=baseNSiz[i];
      if(n.id===selectedId){ col=new THREE.Color(1,1,1); size*=1.7; }
      else if(up[n.id]!==undefined){ col=tmp.copy(upC).multiplyScalar(Math.max(0.5,1-0.12*(up[n.id]-1))); size*=1.15; }
      else if(down[n.id]!==undefined){ col=tmp.copy(downC).multiplyScalar(Math.max(0.5,1-0.12*(down[n.id]-1))); size*=1.15; }
      else if(side[n.id]){ col=tmp.setRGB(baseNCol[i*3],baseNCol[i*3+1],baseNCol[i*3+2]); }
      if(col){ nC[i*3]=col.r; nC[i*3+1]=col.g; nC[i*3+2]=col.b; nS[i]=size; }
      else {
        nC[i*3]=baseNCol[i*3]*DIM; nC[i*3+1]=baseNCol[i*3+1]*DIM; nC[i*3+2]=baseNCol[i*3+2]*DIM;
        nS[i]=baseNSiz[i]*0.5;
      }
    });
    const faint=new THREE.Color(0x15182a);
    visEdges.forEach((e,j)=>{
      const s=e.source_id, t=e.target_id;
      if(e.type==='enables' && up[s]!==undefined && up[t]!==undefined) setEdge(j,upC);
      else if(e.type==='enables' && down[s]!==undefined && down[t]!==undefined) setEdge(j,downC);
      else if(e.type!=='enables' && (s===selectedId||t===selectedId)) setEdge(j,new THREE.Color(EDGE_BASE[e.type]).multiplyScalar(2.5));
      else setEdge(j,faint);
    });
  }
  pColAttr.needsUpdate=true; pSizAttr.needsUpdate=true; lColAttr.needsUpdate=true;
}

// ── Track guides: stage columns, domain lanes, labels ─────────────────────────────────────
function textSprite(text, color, px, anchorX){
  const c=document.createElement("canvas"), ctx=c.getContext("2d");
  const font=`600 ${px}px system-ui, sans-serif`;
  ctx.font=font;
  const w=Math.ceil(ctx.measureText(text).width)+16, h=px+16;
  c.width=w; c.height=h;
  ctx.font=font; ctx.fillStyle=color; ctx.textBaseline="middle"; ctx.fillText(text,8,h/2);
  const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,fog:false}));
  s.center.set(anchorX,0.5);
  s.scale.set(w*4,h*4,1);
  return s;
}

function buildGuides(layout){
  if(!layout) return;
  const g=new THREE.Group();
  const {columns,lanes}=layout;
  const xMin=columns[0].x0, xMax=columns[columns.length-1].x1;
  const yTop=lanes[0].y0, yBot=lanes[lanes.length-1].y1;
  lanes.forEach((l,i)=>{
    const h=l.y0-l.y1;
    const band=new THREE.Mesh(new THREE.PlaneGeometry(xMax-xMin,h),
      new THREE.MeshBasicMaterial({color:i%2?0x12151f:0x161a26,depthWrite:false}));
    band.position.set((xMin+xMax)/2,(l.y0+l.y1)/2,-600);
    g.add(band);
    const lbl=textSprite(l.domain,DOMAIN_COLORS[l.domain]??"#aaa",44,1);
    lbl.position.set(xMin-80,(l.y0+l.y1)/2,0);
    g.add(lbl);
  });
  const pts=[];
  columns.forEach(c=>{ pts.push(c.x0,yTop,-590, c.x0,yBot,-590); });
  pts.push(xMax,yTop,-590, xMax,yBot,-590);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
  g.add(new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x2c3148})));
  columns.forEach(c=>{
    const lbl=textSprite(`${c.stage} · ${c.label}`,"#c9d1e6",52,0.5);
    lbl.position.set((c.x0+c.x1)/2,yTop+220,0);
    g.add(lbl);
  });
  scene.add(g);
}

function fitCamera(){
  if(!currentNodes.length) return;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity,z0=Infinity,z1=-Infinity;
  for(const n of currentNodes){
    x0=Math.min(x0,n.pos_x??0); x1=Math.max(x1,n.pos_x??0);
    y0=Math.min(y0,n.pos_y??0); y1=Math.max(y1,n.pos_y??0);
    z0=Math.min(z0,n.pos_z??0); z1=Math.max(z1,n.pos_z??0);
  }
  const cx=(x0+x1)/2, cy=(y0+y1)/2, cz=(z0+z1)/2;
  // front-on view of the stage × lane plane; orbit to see the layer sheets
  const vTan=Math.tan(camera.fov*Math.PI/360);
  const dist=Math.max((x1-x0+1200)/2/(vTan*camera.aspect), (y1-y0+600)/2/vTan)*1.05+(z1-z0);
  controls.target.set(cx,cy,cz);
  camera.position.set(cx, cy, cz+dist);
  controls.update();
}

// ── 2D view (Canvas 2D: stage columns × domain lanes, pan/zoom) ──────────────────
const cv2=document.getElementById("cv2d"), ctx2=cv2.getContext("2d");
let graphMode="2d", graphLayout=null, maxDegree=1, drawQueued=false, nodeById={};
const view2={cx:0, cy:0, k:0.05, ky:0.05};  // world centre (x, flipped y); pixels per world unit horizontally / vertically
const LABEL_W=120, HEADER_H=28;
const hex=n=>"#"+n.toString(16).padStart(6,"0");
const toScreen=(x,y)=>[(x-view2.cx)*view2.k+cv2.clientWidth/2, (-y-view2.cy)*view2.ky+cv2.clientHeight/2];

function resize2d(){
  const dpr=Math.min(devicePixelRatio,2);
  cv2.width=Math.round(cv2.clientWidth*dpr); cv2.height=Math.round(cv2.clientHeight*dpr);
  ctx2.setTransform(dpr,0,0,dpr,0,0);
  draw2d();
}
function draw2d(){
  if(graphMode!=="2d"||drawQueued) return;
  drawQueued=true;
  requestAnimationFrame(()=>{ drawQueued=false; paint2d(); });
}
function nodeWeight(n){
  return n.weight ?? Math.sqrt((degreeMap[n.id]??0)/maxDegree);
}
function nodeRadius2d(n){
  return Math.min(8,Math.max(2,16*Math.min(view2.k,view2.ky)))*(0.45+2.2*nodeWeight(n)**1.5);
}

function paint2d(){
  const W=cv2.clientWidth, H=cv2.clientHeight, k=view2.k;
  if(!W||!H) return;
  ctx2.textBaseline="middle";
  ctx2.fillStyle="#0f1117"; ctx2.fillRect(0,0,W,H);
  const lanes=graphLayout?.lanes??[], columns=graphLayout?.columns??[];
  if(lanes.length){
    const [xa]=toScreen(columns[0].x0,0), [xb]=toScreen(columns.at(-1).x1,0);
    lanes.forEach((l,i)=>{
      const [,ya]=toScreen(0,l.y0), [,yb]=toScreen(0,l.y1);
      ctx2.fillStyle=i%2?"#12151f":"#161a26"; ctx2.fillRect(xa,ya,xb-xa,yb-ya);
    });
    const [,yt]=toScreen(0,lanes[0].y0), [,yb]=toScreen(0,lanes.at(-1).y1);
    ctx2.strokeStyle="#2c3148"; ctx2.lineWidth=1; ctx2.beginPath();
    [...columns.map(c=>c.x0), columns.at(-1).x1].forEach(x=>{
      const [sx]=toScreen(x,0); ctx2.moveTo(sx,yt); ctx2.lineTo(sx,yb);
    });
    ctx2.stroke();
  }

  const pos={}; currentNodes.forEach(n=>{ pos[n.id]=toScreen(n.pos_x??0,n.pos_y??0); });
  const lin=selLineage, inLin=id=>lin&&(id===selectedId||lin.up[id]!==undefined||lin.down[id]!==undefined||lin.side[id]);
  const baseAlpha=Math.min(0.55,Math.max(0.1,120/Math.max(visEdges.length,1)));
  const edgeStyle=e=>{
    if(!lin) return {c:hex(EDGE_BASE[e.type]??0x3a3f5c), a:baseAlpha, w:1, hot:false};
    const s=e.source_id, t=e.target_id;
    if(e.type==="enables"&&lin.up[s]!==undefined&&lin.up[t]!==undefined) return {c:hex(UP_COLOR),a:0.95,w:1.8,hot:true};
    if(e.type==="enables"&&lin.down[s]!==undefined&&lin.down[t]!==undefined) return {c:hex(DOWN_COLOR),a:0.95,w:1.8,hot:true};
    if(e.type!=="enables"&&(s===selectedId||t===selectedId)) return {c:e.type==="related"?"#9aa3bf":"#f4a261",a:0.9,w:1.5,hot:true};
    return {c:"#2a2f45",a:0.12,w:1,hot:false};
  };
  const drawEdge=(e,st)=>{
    const a=pos[e.source_id], b=pos[e.target_id];
    if(!a||!b) return;
    const dx=(b[0]-a[0])*0.5;
    ctx2.globalAlpha=st.a; ctx2.strokeStyle=st.c; ctx2.lineWidth=st.w;
    ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.bezierCurveTo(a[0]+dx,a[1],b[0]-dx,b[1],b[0],b[1]); ctx2.stroke();
    if(st.hot||k>0.2){
      // arrowhead along the curve's end tangent (b minus second control point)
      let tx=dx, ty=0; if(Math.abs(dx)<1){ tx=b[0]-a[0]; ty=b[1]-a[1]; }
      const len=Math.hypot(tx,ty)||1, ux=tx/len, uy=ty/len, r=nodeRadius2d(nodeById[e.target_id])+1, s=4+st.w*1.5;
      const px=b[0]-ux*r, py=b[1]-uy*r;
      ctx2.fillStyle=st.c; ctx2.beginPath();
      ctx2.moveTo(px,py); ctx2.lineTo(px-ux*s-uy*s*0.6,py-uy*s+ux*s*0.6); ctx2.lineTo(px-ux*s+uy*s*0.6,py-uy*s-ux*s*0.6);
      ctx2.fill();
    }
  };
  const hot=[];
  visEdges.forEach(e=>{ const st=edgeStyle(e); if(st.hot) hot.push([e,st]); else drawEdge(e,st); });
  hot.forEach(([e,st])=>drawEdge(e,st));
  ctx2.globalAlpha=1;

  const showAll=55*view2.ky>=13&&view2.k>=0.12, showLin=view2.ky>=0.06;
  const labels=[];
  currentNodes.forEach(n=>{
    const [x,y]=pos[n.id];
    if(x<-20||y<-20||x>W+20||y>H+20) return;
    const r=nodeRadius2d(n), on=!lin||inLin(n.id);
    ctx2.globalAlpha=on?1:0.12;
    ctx2.fillStyle=DOMAIN_COLORS[n.domain]??"#888";
    ctx2.beginPath();
    if(n.layer==="speculative"){ ctx2.moveTo(x,y-r*1.25); ctx2.lineTo(x+r*1.25,y); ctx2.lineTo(x,y+r*1.25); ctx2.lineTo(x-r*1.25,y); ctx2.closePath(); }
    else ctx2.arc(x,y,r,0,Math.PI*2);
    ctx2.fill();
    if(lin&&on){
      const ring=n.id===selectedId?"#ffffff":lin.up[n.id]!==undefined?hex(UP_COLOR):lin.down[n.id]!==undefined?hex(DOWN_COLOR):null;
      if(ring){ ctx2.strokeStyle=ring; ctx2.lineWidth=n.id===selectedId?2.5:1.5; ctx2.beginPath(); ctx2.arc(x,y,r+3,0,Math.PI*2); ctx2.stroke(); }
    }
    if(n.id===selectedId||(showAll&&on)||(lin&&on&&showLin)||(!lin&&nodeWeight(n)>=0.75)){
      const dist=n.id===selectedId?-1:lin?Math.min(lin.up[n.id]??99,lin.down[n.id]??99,lin.side[n.id]?1:99):99;
      labels.push({n,x:x+r+5,y,prio:dist*1000-nodeWeight(n)*100});
    }
  });
  ctx2.globalAlpha=1;

  // greedy label placement: highest priority first, skip any label that would overlap one already drawn
  ctx2.font="11px system-ui, sans-serif"; ctx2.lineJoin="round";
  const boxes=[];
  labels.sort((a,b)=>a.prio-b.prio).forEach(({n,x,y})=>{
    const text=n.name.length>34?n.name.slice(0,33)+"…":n.name;
    const w=ctx2.measureText(text).width, h=13;
    if(boxes.some(b=>x<b.x+b.w+4&&x+w+4>b.x&&y-h/2<b.y+b.h&&y+h/2>b.y)) return;
    boxes.push({x,y:y-h/2,w,h});
    ctx2.strokeStyle="#0f1117"; ctx2.lineWidth=3; ctx2.strokeText(text,x,y);
    ctx2.fillStyle=n.id===selectedId?"#ffffff":"#c9d1e6"; ctx2.fillText(text,x,y);
  });

  // sticky headers: stage names on top, domain lanes on the left
  if(lanes.length){
    ctx2.fillStyle="rgba(15,17,23,0.9)"; ctx2.fillRect(0,0,W,HEADER_H); ctx2.fillRect(0,HEADER_H,LABEL_W,H-HEADER_H);
    ctx2.font="600 12px system-ui, sans-serif"; ctx2.textAlign="center";
    columns.forEach(c=>{
      const [xa]=toScreen(c.x0,0), [xb]=toScreen(c.x1,0);
      if(xb<LABEL_W||xa>W) return;
      const text=xb-xa>220?`${c.stage} · ${c.label}`:c.stage;
      ctx2.fillStyle="#c9d1e6";
      ctx2.fillText(text,Math.min(Math.max((xa+xb)/2,LABEL_W+60),W-60),HEADER_H/2);
    });
    ctx2.textAlign="right";
    lanes.forEach(l=>{
      const [,ya]=toScreen(0,l.y0), [,yb]=toScreen(0,l.y1);
      if(yb<HEADER_H||ya>H||yb-ya<12) return;
      const y=Math.min(Math.max((ya+yb)/2,Math.max(ya,HEADER_H)+10),Math.min(yb,H)-8);
      ctx2.fillStyle=DOMAIN_COLORS[l.domain]??"#aaa";
      ctx2.fillText(l.domain,LABEL_W-10,y);
    });
    ctx2.textAlign="left";
  }
}

function nodeAt2d(mx,my){
  let best=null, bd=Infinity;
  currentNodes.forEach(n=>{
    const [x,y]=toScreen(n.pos_x??0,n.pos_y??0), d=Math.hypot(x-mx,y-my);
    if(d<nodeRadius2d(n)+5&&d<bd){ best=n; bd=d; }
  });
  return best;
}

function fit2d(){
  if(!currentNodes.length) return;
  let x0=Infinity,x1=-Infinity;
  currentNodes.forEach(n=>{ x0=Math.min(x0,n.pos_x); x1=Math.max(x1,n.pos_x); });
  // vertical extent = full lane stack, so every track stays visible
  const lanes=graphLayout?.lanes;
  const y0=lanes?-lanes[0].y0:Math.min(...currentNodes.map(n=>-n.pos_y));
  const y1=lanes?-lanes.at(-1).y1:Math.max(...currentNodes.map(n=>-n.pos_y));
  const W=cv2.clientWidth-LABEL_W-60, H=cv2.clientHeight-HEADER_H-16;
  view2.k=Math.min(W/Math.max(x1-x0,1), 1);
  view2.ky=Math.min(H/Math.max(y1-y0,1), view2.k*6, 1);
  view2.cx=(x0+x1)/2-(LABEL_W-20)/2/view2.k;
  view2.cy=(y0+y1)/2-(HEADER_H-8)/2/view2.ky;
  draw2d();
}

let drag2=null;
cv2.addEventListener("mousedown",e=>{ drag2={x:e.clientX,y:e.clientY,cx:view2.cx,cy:view2.cy,moved:false}; });
window.addEventListener("mousemove",e=>{
  if(!drag2) return;
  const dx=e.clientX-drag2.x, dy=e.clientY-drag2.y;
  if(Math.abs(dx)+Math.abs(dy)>3){ drag2.moved=true; cv2.classList.add("dragging"); }
  view2.cx=drag2.cx-dx/view2.k; view2.cy=drag2.cy-dy/view2.ky;
  tip.style.display="none";
  draw2d();
});
window.addEventListener("mouseup",e=>{
  if(drag2&&!drag2.moved&&e.target===cv2){
    const r=cv2.getBoundingClientRect();
    selectNode(nodeAt2d(e.clientX-r.left,e.clientY-r.top));
  }
  drag2=null; cv2.classList.remove("dragging");
});
cv2.addEventListener("mousemove",e=>{
  if(drag2) return;
  const r=cv2.getBoundingClientRect(), n=nodeAt2d(e.clientX-r.left,e.clientY-r.top);
  if(n){
    tip.textContent=`${n.name} · ${n.stage} · ${n.domain}${n.layer==="speculative"?" · speculative":""}`;
    tip.style.display="block"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-6)+"px";
    cv2.style.cursor="pointer";
  } else { tip.style.display="none"; cv2.style.cursor=""; }
});
cv2.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv2.getBoundingClientRect(), mx=e.clientX-r.left-cv2.clientWidth/2, my=e.clientY-r.top-cv2.clientHeight/2;
  const wx=mx/view2.k+view2.cx, wy=my/view2.ky+view2.cy;
  // shift+wheel zooms only the stage axis, alt+wheel only the lanes
  const f=Math.exp(-(e.deltaY||e.deltaX)*((e.ctrlKey||e.metaKey)?0.01:0.0015));
  if(!e.altKey) view2.k=Math.min(3,Math.max(0.003,view2.k*f));
  if(!e.shiftKey) view2.ky=Math.min(3,Math.max(0.003,view2.ky*f));
  view2.cx=wx-mx/view2.k; view2.cy=wy-my/view2.ky;
  draw2d();
},{passive:false});

function fitCurrent(){ graphMode==="2d" ? fit2d() : fitCamera(); }

document.getElementById("graph-search").addEventListener("change",e=>{
  const q=e.target.value.trim().toLowerCase();
  const n=currentNodes.find(c=>c.name.toLowerCase()===q)||currentNodes.find(c=>c.name.toLowerCase().includes(q));
  if(!n) return;
  selectNode(n);
  if(graphMode==="2d"){ view2.k=Math.max(view2.k,0.3); view2.ky=Math.max(view2.ky,0.3); view2.cx=n.pos_x; view2.cy=-n.pos_y; draw2d(); }
  else { controls.target.set(n.pos_x,n.pos_y,n.pos_z); controls.update(); }
});

// ── Resize ────────────────────────────────────────────────────────────────────
function resize(){
  const W=wrap.clientWidth, H=wrap.clientHeight;
  if(!W||!H) return;
  if(renderer) renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.updateProjectionMatrix();
  resize2d();
}
window.addEventListener("resize",resize);
if(typeof ResizeObserver !== "undefined") {
  const resizeObserver = new ResizeObserver(() => resize());
  resizeObserver.observe(wrap);
}
resize();

// ── Render loop ───────────────────────────────────────────────────────────────
(function render(){
  requestAnimationFrame(render);
  if(!renderer||graphMode!=="3d") return;
  controls.update(); renderer.render(scene,camera);
})();

// ── Controls ────────────────────────────────────────────────────────────────────────────────
document.getElementById("sel-stage").addEventListener("change",()=>{buildGraph();fitCurrent();});
document.getElementById("btn-fit").addEventListener("click",fitCurrent);
document.getElementById("sel-lineage").addEventListener("change",e=>{
  lineageDepth=Number(e.target.value); applySelection();
});
document.querySelectorAll(".toggle-btn[data-layer]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const l=btn.dataset.layer; layerVisible[l]=!layerVisible[l];
    btn.classList.toggle("on",layerVisible[l]); buildGraph();
  });
});
document.querySelectorAll(".toggle-btn[data-edgetype]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const t=btn.dataset.edgetype; edgeTypeVisible[t]=!edgeTypeVisible[t];
    btn.classList.toggle("on",edgeTypeVisible[t]); buildGraph();
  });
});

// ── Load ──────────────────────────────────────────────────────────────────────
fetch("data/concept_graph.json").then(r=>r.json()).then(data=>{
  allNodes=data.concepts; allEdges=data.edges; graphLayout=data.layout??null;
  data.edges.forEach(e=>{
    degreeMap[e.source_id]=(degreeMap[e.source_id]??0)+1;
    degreeMap[e.target_id]=(degreeMap[e.target_id]??0)+1;
  });
  maxDegree=Math.max(1,...Object.values(degreeMap));
  nodeById=Object.fromEntries(allNodes.map(n=>[n.id,n]));
  document.getElementById("graph-names").innerHTML=
    [...new Set(allNodes.map(n=>n.name))].sort().map(n=>`<option value="${n.replace(/"/g,"&quot;")}">`).join("");
  buildGuides(data.layout);
  buildGraph(); fitCamera();
  buildEdgeIndex();
  // default to catalog: select first stage
  catStage = "K0_EARTH";
  catLoadStage(catStage);
});

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

// ── Catalog ───────────────────────────────────────────────────────────────────
let catStage = null, catActiveRow = null, catAllConcepts = [];
let catSortKey = "name", catSortDir = 1;
let catEdgesById = {};

function buildEdgeIndex() {
  const nameMap = {};
  allNodes.forEach(n => { nameMap[n.id] = n.name; });
  catEdgesById = {};
  allNodes.forEach(n => { catEdgesById[n.id] = {out: [], in: []}; });
  allEdges.forEach(e => {
    if (catEdgesById[e.source_id]) catEdgesById[e.source_id].out.push({...e, peer_id: e.target_id, peer_name: nameMap[e.target_id] ?? "?"});
    if (catEdgesById[e.target_id]) catEdgesById[e.target_id].in.push({...e, peer_id: e.source_id, peer_name: nameMap[e.source_id] ?? "?"});
  });
}

function catBadge(cls, text) { return `<span class="badge ${cls}">${text}</span>`; }
function catConfBadge(c) {
  return catBadge({confirmed:"badge-confirmed",unreviewed:"badge-unreviewed",noise:"badge-noise"}[c]??"", c);
}
function catLayerBadge(l) { return catBadge(l==="scientific"?"badge-sci":"badge-spec", l); }

function catCmp(a, b) {
  if (catSortKey === "flags") return ((b.is_barrier+b.is_choice+(b.is_enabler||0))-(a.is_barrier+a.is_choice+(a.is_enabler||0)))*catSortDir;
  if (catSortKey === "links") return ((degreeMap[b.id]??0)-(degreeMap[a.id]??0))*catSortDir;
  return (a[catSortKey]??"").localeCompare(b[catSortKey]??"")*catSortDir;
}

function catRenderRows(concepts) {
  const tbody = document.getElementById("cat-tbody");
  if (!concepts.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="cat-empty">No concepts found.</td></tr>`;
    return;
  }
  tbody.innerHTML = concepts.map(c => {
    const barrier = c.is_barrier ? `<span class="cat-flag cat-flag-active" title="Barrier">⚠</span> ` : "";
    const choice  = c.is_choice  ? `<span class="cat-flag cat-flag-active" title="Choice">⑂</span> ` : "";
    const enabler = c.is_enabler ? `<span class="cat-flag cat-flag-active" title="Enabler">→</span>` : "";
    return `<tr data-id="${c.id}">
      <td>${c.name}</td>
      <td><span class="cat-flag">${c.domain}</span></td>
      <td>${catLayerBadge(c.layer)}</td>
      <td><span class="cat-flag">${c.maturity}</span></td>
      <td>${catConfBadge(c.confidence)}</td>
      <td>${barrier}${choice}${enabler}</td>
      <td style="color:var(--muted);font-size:11px">${degreeMap[c.id]??0}</td>
    </tr>`;
  }).join("");
}

function catFilterSort() {
  const q = document.getElementById("cat-search").value.toLowerCase();
  let cs = q ? catAllConcepts.filter(c =>
    c.name.toLowerCase().includes(q) || c.domain.toLowerCase().includes(q)
  ) : catAllConcepts;
  cs = [...cs].sort(catCmp);
  catRenderRows(cs);
  document.querySelectorAll("#cat-table th[data-sort]").forEach(th => {
    const arr = th.querySelector(".cat-sort-arrow");
    arr.textContent = th.dataset.sort === catSortKey ? (catSortDir===1?" ↑":" ↓") : "";
  });
}

function catLoadStage(stage) {
  catAllConcepts = allNodes.filter(c => c.stage === stage);
  catFilterSort();
}

function catOpenDetail(id) {
  const c = allNodes.find(n => n.id === id);
  if (!c) return;
  document.getElementById("cat-detail-title").textContent = c.name;
  document.getElementById("cd-domain").textContent   = c.domain;
  document.getElementById("cd-stage").textContent    = c.stage;
  document.getElementById("cd-layer").innerHTML      = catLayerBadge(c.layer);
  document.getElementById("cd-maturity").textContent = c.maturity;
  document.getElementById("cd-confidence").innerHTML = catConfBadge(c.confidence);
  document.getElementById("cd-flags").textContent    = [
    c.is_barrier ? "⚠ Barrier" : null,
    c.is_choice  ? "⑂ Choice"  : null,
    c.is_enabler ? "→ Enabler" : null,
  ].filter(Boolean).join("  ") || "—";
  document.getElementById("cd-description").textContent = c.description ?? "";

  const edges = catEdgesById[id] || {out:[], in:[]};
  const renderList = (ulId, items) => {
    const ul = document.getElementById(ulId);
    ul.innerHTML = items.length
      ? items.map(e => `<li><span class="cat-edge-type">${e.type}</span><a class="cat-edge-link" data-id="${e.peer_id}">${e.peer_name}</a></li>`).join("")
      : `<li style="color:var(--muted);font-size:11px">None</li>`;
  };
  renderList("cat-edges-out", edges.out);
  renderList("cat-edges-in",  edges.in);

  document.getElementById("cat-pane-detail").hidden = false;
}

function catCloseDetail() {
  document.getElementById("cat-pane-detail").hidden = true;
  if (catActiveRow) { catActiveRow.classList.remove("active"); catActiveRow = null; }
}

// Stage nav
document.getElementById("cat-stage-nav").addEventListener("click", e => {
  const btn = e.target.closest(".cat-stage-btn");
  if (!btn) return;
  document.querySelector(".cat-stage-btn.active")?.classList.remove("active");
  btn.classList.add("active");
  catStage = btn.dataset.stage;
  catCloseDetail();
  catLoadStage(catStage);
});

// Table row click
document.getElementById("cat-tbody").addEventListener("click", e => {
  const row = e.target.closest("tr[data-id]");
  if (!row) return;
  if (catActiveRow) catActiveRow.classList.remove("active");
  catActiveRow = row;
  row.classList.add("active");
  catOpenDetail(parseInt(row.dataset.id));
});

// Column sort
document.querySelector("#cat-table thead").addEventListener("click", e => {
  const th = e.target.closest("th[data-sort]");
  if (!th) return;
  const k = th.dataset.sort;
  if (catSortKey === k) catSortDir *= -1;
  else { catSortKey = k; catSortDir = 1; }
  catFilterSort();
});

// Search
document.getElementById("cat-search").addEventListener("input", catFilterSort);

// Close detail
document.getElementById("btn-close-cat").addEventListener("click", catCloseDetail);

// Edge link navigation — jump to linked concept, switching stage if needed
document.getElementById("cat-pane-detail").addEventListener("click", e => {
  const a = e.target.closest(".cat-edge-link");
  if (!a) return;
  const targetId = parseInt(a.dataset.id);
  const targetConcept = allNodes.find(n => n.id === targetId);
  if (!targetConcept) return;
  if (targetConcept.stage !== catStage) {
    document.querySelector(".cat-stage-btn.active")?.classList.remove("active");
    const btn = document.querySelector(`.cat-stage-btn[data-stage="${targetConcept.stage}"]`);
    if (btn) { btn.classList.add("active"); catStage = targetConcept.stage; catLoadStage(catStage); }
  }
  const row = document.querySelector(`#cat-tbody tr[data-id="${targetId}"]`);
  if (row) {
    if (catActiveRow) catActiveRow.classList.remove("active");
    catActiveRow = row;
    row.classList.add("active");
    row.scrollIntoView({block:"nearest"});
  }
  catOpenDetail(targetId);
});

// View toggle: catalog | 2d | 3d
const fitted={};
function showView(mode){
  const graph=mode!=="catalog";
  document.getElementById("cv-wrap").hidden        = !graph;
  document.getElementById("graph-controls").hidden  = !graph;
  document.getElementById("catalog-view").hidden    = graph;
  document.getElementById("cat-controls").hidden    = graph;
  ["catalog","2d","3d"].forEach(m=>document.getElementById(`btn-view-${m}`).classList.toggle("on",m===mode));
  if(!graph) return;
  graphMode=mode;
  canvas.style.display = mode==="3d"?"block":"none";
  cv2.style.display    = mode==="2d"?"block":"none";
  tip.style.display="none";
  requestAnimationFrame(()=>{
    resize();
    if(!fitted[mode]){ fitted[mode]=true; fitCurrent(); }
    draw2d();
  });
}
document.getElementById("btn-view-catalog").addEventListener("click",()=>showView("catalog"));
document.getElementById("btn-view-2d").addEventListener("click",()=>showView("2d"));
document.getElementById("btn-view-3d").addEventListener("click",()=>showView("3d"));
if(!renderer){
  const b=document.getElementById("btn-view-3d");
  b.disabled=true; b.title="WebGL is not available in this browser";
}
</script>
</body>
</html>
